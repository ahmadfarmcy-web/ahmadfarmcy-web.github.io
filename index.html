<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3Cmask id='m'%3E%3Crect width='48' height='48' fill='%23fff'/%3E%3Ccircle cx='29' cy='24' r='12' fill='%23000'/%3E%3C/mask%3E%3C/defs%3E%3Ccircle cx='24' cy='24' r='24' fill='%23fff'/%3E%3Ccircle cx='23' cy='24' r='15.5' fill='%23d32f2f' mask='url(%23m)'/%3E%3C/svg%3E">
<title>صيدلية أحمد نبيه - النواقص</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17302b;--mute:#5f7570;--paper:#f2f5f3;--card:#fff;--line:#d9e2de;--brand:#0f6b5c;--need:#b45f06;--ord:#2b5fa8;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--paper);color:var(--ink);padding-top:env(safe-area-inset-top)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #7bc4b6;outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
#login form{width:min(380px,100%);display:grid;gap:12px}
#login h1{font-size:28px;margin-bottom:4px}
#login p{color:var(--mute);font-size:15px}

.sgbox{display:grid;gap:4px}
.sgi{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.sgi small{color:#777;white-space:nowrap;font-size:12px}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.btn{background:var(--brand);color:#fff;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px}
.err{color:var(--bad);font-size:14px;min-height:20px}
/* app */
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;flex:1;line-height:1.25}header h1 small{display:block;font-size:12.5px;font-weight:400;opacity:.8}.logo{width:42px;height:42px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#9ad7a6}
.dot.off{background:#f0b36a}
.who{background:rgba(255,255,255,.16);border-radius:8px;padding:6px 10px;font-size:14px}
.tools{padding:12px 16px 0;display:grid;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:10px 4px;border-radius:10px;background:#e3ebe7;font-weight:500;font-size:15px}
.tab b{display:block;font-size:18px}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
main{padding:12px 16px 110px;display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-inline-start:5px solid var(--need);display:grid;gap:8px}
.item.ordered{border-inline-start-color:var(--ord)}
.item.arrived{border-inline-start-color:var(--ok);opacity:.8}
.top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.nm{font-weight:700;font-size:17px}
.qty{background:var(--paper);border-radius:8px;padding:3px 10px;font-weight:700;white-space:nowrap}
.meta{color:var(--mute);font-size:13.5px;line-height:1.7}
.flag{color:var(--ord);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.a{padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);font-size:14.5px;font-weight:500}
.a.p{background:var(--ord);color:#fff;border-color:var(--ord)}
.a.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.a.d{color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:40px 10px;line-height:1.9}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:16px;padding:15px 22px;font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,25,21,.5);display:flex;align-items:flex-end;z-index:20}
.panel{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:10px}
.panel h2{font-size:19px}
.row{display:grid;grid-template-columns:1fr 90px;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{padding:10px;border-radius:10px;background:#e3ebe7;font-weight:500}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.warn{background:#fff4e0;border:1px solid #f0cf94;border-radius:10px;padding:10px;font-size:14.5px;line-height:1.7}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));inset-inline:16px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;z-index:30;font-size:15px;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.3)}
@media(min-width:700px){main,.tools{max-width:760px;margin-inline:auto;width:100%}
.sheet{align-items:center;justify-content:center}.panel{max-width:560px;border-radius:18px}
#toast{max-width:560px;margin-inline:auto}}
@media(min-width:900px){
.tools,main{max-width:960px}
.tools{grid-template-columns:repeat(12,1fr);align-items:stretch}
#ordmode{grid-column:span 5;order:1}#q{grid-column:span 7;order:2}#pend{grid-column:1/-1;order:3}
.tabs{grid-column:1/-1;order:4}#kindf{grid-column:span 6;order:5}#dayf{grid-column:span 6;order:6}
.chips,.oq,#okf,.ordb{max-width:960px;margin-inline:auto;width:100%}
}
.ord{position:fixed;inset:0;background:var(--paper);z-index:15;overflow:auto;padding-top:env(safe-area-inset-top)}
.ordh{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:2;font-size:18px}
.ordh .a{background:rgba(255,255,255,.15);color:#fff;border:0}
.ordh span{margin-inline-start:auto;font-size:14px;opacity:.85}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
.chip{padding:10px 18px;border-radius:99px;background:#e3ebe7;white-space:nowrap;font-weight:500}
.chip[aria-pressed=true]{background:var(--brand);color:#fff}
.oq{padding:8px 16px 0}
.ordb{padding:8px 16px 60px;display:grid;gap:8px}
.orow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.onm{flex:1;font-weight:700;font-size:17px;line-height:1.5}
.onm small{display:block;color:var(--mute);font-weight:500;font-size:13px}
.ob{width:56px;height:56px;border-radius:14px;font-size:28px;color:#fff;flex:none}
.ob.yes{background:var(--ok)}.ob.no{background:var(--bad)}
.orow.off{opacity:.6}.orow.done{border-color:var(--ok);background:#eef7f1}
.sect{font-size:14px;color:var(--mute);margin:12px 2px 0}
.big{width:100%;padding:14px;font-size:17px}
.tab{font-size:14px}.sect.old{color:var(--need);font-weight:700}#dayf{grid-template-columns:repeat(3,1fr)}
.item.urgent{border-inline-start-color:var(--bad)!important;background:#fff6f5}
.fold{width:100%;padding:14px;font-weight:700;color:var(--need);border-color:var(--need);background:#fff}

/* ===== مراحل الصنف ===== */
.tabs{grid-template-columns:repeat(3,1fr)!important}@media(min-width:620px){.tabs{grid-template-columns:repeat(6,1fr)!important}}.tab{font-size:12.5px!important;padding:9px 2px!important;line-height:1.3}.tab b{font-size:17px!important}
.stp{display:flex;align-items:flex-start;margin:6px 0 4px}
.st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;text-align:center;min-width:0}
.st::before{content:"";position:absolute;top:10px;inset-inline-start:50%;width:100%;height:3px;background:#e3ebe7}
.st:last-child::before{display:none}.st.done::before{background:var(--ok)}
.st i{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:#e3ebe7;border:2px solid #e3ebe7;display:grid;place-items:center;font-size:12px;font-style:normal;color:#fff}
.st.done i{background:var(--ok);border-color:var(--ok)}
.st.cur i{background:#fff;border-color:var(--need);box-shadow:0 0 0 3px #f6e3c8}
.st span{font-size:11.5px;margin-top:4px;color:var(--mute);line-height:1.3}
.st.done span{color:var(--ink);font-weight:700}.st.cur span{color:var(--need);font-weight:700}
.st small{font-size:10.5px;color:var(--mute)}
.sline{border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;background:#fff4e0;color:var(--need)}
.sline.s-ord{background:#e8f0fb;color:var(--ord)}.sline.s-ok{background:#e9f6ee;color:var(--ok)}.sline.s-bad{background:#fdecea;color:var(--bad)}.sline.s-gray{background:#eef2f0;color:var(--mute)}
.item.nf,.item.ret{border-inline-start-color:var(--bad)}

.dbt{position:fixed;inset:0;background:var(--paper);z-index:15;overflow:auto;padding-top:env(safe-area-inset-top)}
.dbt .dtop,.dbt .lst{max-width:960px;margin-inline:auto;width:100%;padding-inline:16px}
.dbt .sum{display:flex;gap:10px;flex-wrap:wrap;padding-top:12px;font-size:15px}
.dbt .sum b{font-size:20px}
.dbt .row2{display:flex;gap:8px;padding-top:10px;flex-wrap:wrap}
.dbt .lst{display:grid;gap:8px;padding-top:10px;padding-bottom:60px}
.dc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.dc.sent{opacity:.55}
.dc .nm{font-weight:700;font-size:16px}.dc .am{font-size:18px;font-weight:800;color:var(--bad)}
.dc .ph{font-size:13px;color:var(--mute);direction:ltr;text-align:right}
.dc .inf{flex:1;min-width:0}
.sm{background:var(--ord);color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;text-decoration:none;white-space:nowrap;font-size:15px}
.dc .bt{display:flex;flex-direction:column;gap:6px}
.wa{background:#1fa855;color:#fff;border-radius:12px;padding:12px 14px;font-weight:700;text-decoration:none;white-space:nowrap;border:0;font-size:15px}
</style>
</head>
<body>

<section id="login" class="hide">
  <form id="lf">
    <h1>صيدلية أحمد نبيه</h1>
    <p>سجّل دخولك بحساب الصيدلية.</p>
    <input class="in" id="em" type="email" placeholder="الإيميل" autocomplete="username" required dir="ltr">
    <input class="in" id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password" required dir="ltr">
    <div class="err" id="le"></div>
    <button class="btn" type="submit">دخول</button>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><mask id="cm"><rect width="48" height="48" fill="#fff"/><circle cx="29" cy="24" r="12" fill="#000"/></mask></defs><circle cx="24" cy="24" r="23" fill="#fff"/><circle cx="23" cy="24" r="15.5" fill="#d32f2f" mask="url(#cm)"/></svg>
    <h1>صيدلية أحمد نبيه<small>قائمة النواقص</small></h1>
    <span class="dot" id="dot" title="الاتصال"></span>
    <button class="who" id="who"></button>
  </header>
  <div class="tools">
    <button class="btn big" id="ordmode">📞 وضع الطلب من شركة</button>
    <button class="btn big" id="dbtmode" style="background:var(--need)">💬 مطالبة العملاء</button>
    <button class="a hide" id="pend" style="border-color:var(--bad);color:var(--bad);font-weight:700;padding:12px"></button>
    <input class="in" id="q" type="search" placeholder="ابحث بالصنف أو اسم العميل أو رقم تليفونه">
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-t="needed">مسجّل<b id="c1">0</b></button>
      <button class="tab" role="tab" data-t="ordered">اتطلب<b id="c2">0</b></button>
      <button class="tab" role="tab" data-t="arrived">وصل<b id="c3">0</b></button>
      <button class="tab" role="tab" data-t="ret">مرتجع<b id="c4">0</b></button>
      <button class="tab" role="tab" data-t="nf">مش لاقيينه<b id="c5">0</b></button>
      <button class="tab" role="tab" data-t="archive">أرشيف<b id="c6">0</b></button>
    </div>
    <div class="seg" id="kindf" style="grid-template-columns:repeat(3,1fr)"><button data-k="all">الكل</button><button data-k="stock">📦 نواقص المخزن</button><button data-k="customer">👤 طلبات العملاء</button></div>
    <div class="seg" id="dayf"><button data-d="all">كل الأيام</button><button data-d="0">النهاردة</button><button data-d="1">إمبارح</button></div>
  </div>
  <main id="list"></main>
  <button class="fab" id="add">+ صنف ناقص</button>
</section>

<div id="ord" class="ord hide">
  <div class="ordh"><button class="a" id="oback">← رجوع</button><b>طلب من شركة</b><span id="ocount"></span></div>
  <div class="chips" id="chips"></div>
  <div class="oq" style="display:flex;gap:8px"><input class="in" id="oq" type="search" placeholder="ابحث عن صنف" style="flex:1"><button class="a" id="oimp" style="white-space:nowrap">📥 استيراد إكسل</button></div>
  <div class="seg" id="okf" style="grid-template-columns:repeat(3,1fr);padding:8px 16px 0"><button data-k="all">الكل</button><button data-k="stock">📦 المخزن</button><button data-k="customer">👤 العملاء</button></div>
  <div class="ordb" id="olist"></div>
</div>

<div id="dbt" class="dbt hide">
  <div class="ordh"><button class="a" id="dback">← رجوع</button><b>مطالبة العملاء</b><span id="dwhen"></span></div>
  <div class="dtop">
    <div class="sum" id="dsum"></div>
    <div class="row2"><button class="a" id="dimp">📥 رفع تقرير المدينين</button><button class="a" id="dtpl">✏️ نص الرسالة</button><button class="a" id="dreset">↺ تصفير علامات الإرسال</button></div>
    <div class="row2"><input class="in" id="dq" type="search" placeholder="ابحث بالاسم أو الرقم" style="flex:1;min-width:180px"><input class="in" id="dmin" type="number" inputmode="decimal" placeholder="أقل مبلغ" style="width:110px"></div>
    <div class="seg" id="dflt" style="grid-template-columns:repeat(3,1fr);margin-top:10px"><button data-f="all">الكل</button><button data-f="todo">لسه ما اتبعتش</button><button data-f="nophone">بدون رقم</button></div>
  </div>
  <div class="lst" id="dlist"></div>
</div>

<div id="toast" class="hide" role="status"></div>
<div id="sheet" class="sheet hide"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,orderBy,limit,setDoc,getDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== الصق هنا بيانات Firebase (Project settings > General > pharmacy-web > Config) ====== */
const firebaseConfig={
  apiKey:"AIzaSyBRa9TGiytW8L64T5NPkvG1vBqfPY7vT-8",
  authDomain:"pharmacy-shortages.firebaseapp.com",
  projectId:"pharmacy-shortages",
  storageBucket:"pharmacy-shortages.firebasestorage.app",
  messagingSenderId:"1074086208014",
  appId:"1:1074086208014:web:c63f3c8d1d99b29fdc525f"
};
/* ================================================================ */

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[ً-ٰٟ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim();
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};


let items=[],tab="needed",first=true;
const me={name:ls("name")||"",shift:ls("shift")||"صباحي"};
let app,auth,db,unsub=null,started=false;
try{
  app=initializeApp(firebaseConfig);auth=getAuth(app);
  db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
}catch(e){$("#login").classList.remove("hide");$("#le").textContent="تأكد من بيانات Firebase في أول الملف."}
if(auth)onAuthStateChanged(auth,u=>{
  if(u){$("#login").classList.add("hide");$("#app").classList.remove("hide");if(!started){started=true;start()}if(!me.name)askWho()}
  else{if(unsub)unsub();unsub=null;if(ordUnsub)ordUnsub();ordUnsub=null;lastOrd=null;started=false;first=true;$("#app").classList.add("hide");$("#login").classList.remove("hide")}
});
$("#lf").onsubmit=async e=>{e.preventDefault();$("#le").textContent="";
  try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}
  catch(err){$("#le").textContent="الإيميل أو كلمة السر غلط، جرّب تاني."}};
function start(){
  paintWho();onSnapshot(doc(db,"settings","main"),sn=>{if(sn.exists())cfg={...cfg,...sn.data()}},()=>{});setTimeout(()=>{if(!ordUnsub)watchOrders()},1500);loadCat();
  unsub=onSnapshot(query(collection(db,"items"),orderBy("ts","desc")),snap=>{
    items=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!first)snap.docChanges().forEach(c=>{
      if(c.doc.metadata.hasPendingWrites)return;
      const d=c.doc.data();
      if(c.type==="added")say(`🆕 ${d.name} اتضاف بواسطة ${d.by||"زميل"}`);
      if(c.type==="modified"&&d.status==="ordered")say(`📦 ${d.name} اتطلب${d.supplier?" من "+d.supplier:""} بواسطة ${d.orderedBy||"زميل"} — متطلبوش تاني`);
      if(c.type==="modified"&&d.status==="arrived")say(`✅ ${d.name} وصل`);
    });
    first=false;
    setTimeout(applyOrders,0);
    $("#dot").classList.toggle("off",snap.metadata.fromCache);
    render();
  },err=>{$("#dot").classList.add("off");say("مش قادر أقرا البيانات: "+err.code)});
}

const wfail=e=>{const m=e&&e.code==="permission-denied"?"❌ مفيش صلاحية للحفظ (راجع Rules في Firestore)":"❌ الحفظ فشل: "+((e&&e.code)||e);say(m);$("#dot").classList.add("off")};
window.addEventListener("unhandledrejection",e=>{const c=e.reason&&e.reason.code;if(c)say("خطأ: "+c)});
let tt;function say(m){const t=$("#toast");t.textContent=m;t.classList.remove("hide");clearTimeout(tt);tt=setTimeout(()=>t.classList.add("hide"),4500);if(navigator.vibrate)navigator.vibrate(60)}
const paintWho=()=>$("#who").textContent=`${me.name||"؟"} • ${me.shift}`;
$("#who").onclick=()=>askWho();

function open(html){const s=$("#sheet");s.innerHTML=`<div class="panel">${html}</div>`;s.classList.remove("hide");s.onclick=e=>{if(e.target===s)close()}}
function close(){$("#sheet").classList.add("hide");$("#sheet").innerHTML=""}

function askWho(){
  open(`<h2>أنت مين؟</h2>
  <input class="in" id="wn" placeholder="اسمك" value="${esc(me.name)}">
  <div class="seg" id="ws"><button aria-pressed="${me.shift==="صباحي"}" data-s="صباحي">صباحي</button><button aria-pressed="${me.shift==="مسائي"}" data-s="مسائي">مسائي</button></div>
  <button class="btn" id="wok">حفظ</button><button class="a d" id="wout">تسجيل خروج</button><button class="a" id="wbk">💾 نسخة احتياطية</button><button class="a" id="wrs">♻️ استعادة نسخة</button>`);
  let sh=me.shift;
  $("#ws").onclick=e=>{const b=e.target.closest("button");if(!b)return;sh=b.dataset.s;[...$("#ws").children].forEach(x=>x.setAttribute("aria-pressed",x===b))};
  $("#wout").onclick=()=>{close();signOut(auth)};
  $("#wbk").onclick=backupSheet;$("#wrs").onclick=restoreSheet;
  $("#wok").onclick=()=>{const n=$("#wn").value.trim();if(!n){$("#wn").focus();return}me.name=n;me.shift=sh;ls("name",n);ls("shift",sh);paintWho();close()};
}

  const dStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
  const t0=dStart(Date.now());
  const msOf=i=>(i.archived&&tsMs(i.archivedAt))||(i.delivered&&tsMs(i.deliveredAt))||(i.status==="arrived"&&tsMs(i.arrivedAt))||tsMs(i.ts)||Date.now();

  const hit=i=>norm(i.name).includes(q)||norm(i.customer||"").includes(q)||(qd.length>=3&&String(i.phone||"").replace(/\D/g,"").includes(qd))||norm(dateTxt(i)).includes(q);

  let last="";

    const steps=[["اتسجّل",true,i.ts],["اتطلب",i.status!=="needed",i.orderedAt],["وصل",i.status==="arrived",i.arrivedAt]];

const tel=String(i.phone||"").replace(/[^\d+]/g,"");

/* ===== catalog suggestions ===== */
let CAT=[];
const AR={"ب":"b","ت":"t","ث":"t","ج":"g","ح":"h","خ":"k","د":"d","ذ":"d","ر":"r","ز":"s","س":"s","ش":"s","ص":"s","ض":"d","ط":"t","ظ":"s","غ":"g","ف":"f","ق":"k","ك":"k","ل":"l","م":"m","ن":"n","ه":"h"};
function sk(s){
  s=String(s).toLowerCase().replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  s=s.replace(/sh/g,"s").replace(/ph/g,"f").replace(/th/g,"t").replace(/ch/g,"k").replace(/kh/g,"k");
  let o="";
  for(const c of s){
    if(AR[c])o+=AR[c];
    else if(/[0-9]/.test(c))o+=c;
    else if("pv".includes(c))o+=c==="p"?"b":"f";
    else if("ckq".includes(c))o+="k";
    else if(c==="x")o+="ks";
    else if(c==="j")o+="g";
    else if(c==="z")o+="s";
    else if(/[bdfghlmnrstw]/.test(c)&&c!=="w")o+=c;
  }
  return o.replace(/(.)\1+/g,"$1");
}
let catLvl=0;
function setCat(a,lvl){if(lvl<catLvl)return;catLvl=lvl;CAT=a.map(x=>{const l=String(x[0]).toLowerCase();return{n:x[0],p:x[1],k:x[2],l,w:l.split(/[\s\-\/]+/),s:sk(x[0])}})}
fetch("catalog.json").then(r=>r.json()).then(a=>setCat(a,1)).catch(()=>{});
async function loadCat(){
  try{
    const m=await getDoc(doc(db,"catalog","meta"));
    if(!m.exists())return;
    const md=m.data(),v=md.v;let cached=null;
    try{cached=JSON.parse(localStorage.getItem("catv")||"null")}catch(e){}
    if(cached&&cached.v===v&&cached.d){setCat(cached.d,2);return}
    const sn=await getDocs(collection(db,"catalog"));
    const n=+md.chunks||0,parts=[];
    sn.forEach(d=>{const mm=/^c(\d+)$/.exec(d.id);if(mm&&+mm[1]<n)parts.push([+mm[1],d.data().d])});
    parts.sort((a,b)=>a[0]-b[0]);
    const arr=[];parts.forEach(p=>{try{arr.push(...JSON.parse(p[1]))}catch(e){}});
    if(arr.length>100){setCat(arr,2);try{localStorage.setItem("catv",JSON.stringify({v,d:arr}))}catch(e){}}
  }catch(e){}
}
function suggest(q){
  q=q.trim().toLowerCase();if(q.length<2||!CAT.length)return[];
  const qs=sk(q),r=[];
  for(const c of CAT){
    let sc=99;
    if(c.l.startsWith(q))sc=0;
    else if(c.w.some(w=>w.startsWith(q)))sc=1;
    else if(qs.length>=2&&c.s.startsWith(qs))sc=2;
    else if(c.l.includes(q))sc=3;
    else if(qs.length>=3&&c.s.includes(qs))sc=4;
    if(sc<99)r.push([sc,c]);
  }
  r.sort((a,b)=>a[0]-b[0]||a[1].n.length-b[1].n.length);
  return r.slice(0,8).map(x=>x[1]);
}
function attachSuggest(inp,onpick){
  const box=document.createElement("div");box.className="sgbox";(inp.closest(".row")||inp).after(box);
  const draw=()=>{
    const L=suggest(inp.value);
    if(!L.length){box.innerHTML="";return}
    box.innerHTML=L.map((c,i)=>`<button type="button" class="sgi" data-i="${i}"><span dir="auto">${esc(c.n)}</span><small>${c.p?c.p+" ج":""}${c.k!=null?" · رصيد "+c.k:""}</small></button>`).join("");
    box.onpointerdown=e=>{const b=e.target.closest(".sgi");if(!b)return;e.preventDefault();inp.value=L[b.dataset.i].n;box.innerHTML="";inp.dispatchEvent(new Event("input"));onpick&&onpick()};
  };
  inp.addEventListener("input",draw);
}

async function importDebts(f){

  $("#pok").onclick=async()=>{
    const v=$("#pin").value.trim();
    if(!h){if(v.length<4){say("الرقم لازم 4 أرقام على الأقل");return}try{localStorage.setItem("dbtpin",await sha(v))}catch(e){}close();showDbt();return}
    if(await sha(v)===h){close();showDbt()}else{say("الرقم غلط");$("#pin").value=""}
  };
};
$("#dback").onclick=()=>{$("#dbt").classList.add("hide");dUnl=false};
$("#dq").oninput=renderDbt;$("#dmin").oninput=renderDbt;
$("#dflt").onclick=e=>{const b=e.target.closest("button");if(!b)return;dFlt=b.dataset.f;renderDbt()};
$("#dimp").onclick=()=>{
  const nph=Object.keys(PH).length;
  open(`<h2>رفع الملفات</h2><p class="meta">١) تقرير المدينين (إكسل من فارما فلاي: كود العميل، اسم العميل، قيمة الدين). بتعمله كل مرة.</p>
  <label class="btn" style="text-align:center;position:relative;overflow:hidden;display:block">📂 تقرير المدينين<input id="df" type="file" accept=".xlsx,.xls,.csv" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label>
  <p class="meta" style="margin-top:14px">٢) ملف أرقام العملاء (phones.csv). بترفعه مرة وبعدين كل ما تضيف عملاء جداد. ${nph?`الأرقام المحفوظة دلوقتي: ${nph}`:"لسه ما اتحمّلش."}</p>
  <label class="btn" style="text-align:center;position:relative;overflow:hidden;display:block;background:var(--ord)">📞 ملف الأرقام<input id="dp" type="file" accept=".csv,.txt,.xlsx,.xls" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0"></label><button class="a" id="dcx">إغلاق</button>`);
  $("#dcx").onclick=close;
  $("#df").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await importDebts(f);close()}catch(err){say("مقدرتش أقرا الملف. تأكد إنه تقرير المدينين (كود، اسم، قيمة الدين).")}};
  $("#dp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await importPhones(f);close()}catch(err){say("مقدرتش أقرا ملف الأرقام. المفروض عمودين: كود العميل ثم الرقم.")}};
};
$("#dtpl").onclick=()=>{
  open(`<h2>نص الرسالة</h2><p class="meta">استخدم {الاسم} و{المبلغ} وهيتبدلوا لكل عميل.</p><textarea class="in" id="dt" rows="6">${esc(dTpl)}</textarea><button class="btn" id="dts">حفظ</button><button class="a" id="dtd">رجّع النص الأصلي</button><button class="a" id="dtc">إلغاء</button>`);
  $("#dtc").onclick=close;$("#dtd").onclick=()=>{$("#dt").value=DEF_TPL};
  $("#dts").onclick=()=>{dTpl=$("#dt").value.trim()||DEF_TPL;dset("dbtpl",dTpl);close();renderDbt();say("اتحفظ نص الرسالة")};
};
$("#dreset").onclick=()=>{D.sent={};dset("dbt",D);renderDbt();say("اتصفّرت علامات الإرسال")};
$("#dlist").onclick=e=>{
  const w=e.target.closest("a.wa,a.sm");
  if(w){D.sent[w.dataset.id]=Date.now();dset("dbt",D);setTimeout(renderDbt,400);return}
  const p=e.target.closest("[data-ph]");
  if(p){const id=p.dataset.ph;
    open(`<h2>إضافة رقم</h2><input class="in" id="dpn" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" style="direction:ltr"><button class="btn" id="dps">حفظ</button><button class="a" id="dpc">إلغاء</button>`);
    $("#dpc").onclick=close;
    $("#dps").onclick=()=>{const {phone}=splitCust($("#dpn").value);if(!phone){say("الرقم مش صحيح (لازم 11 رقم يبدأ بـ 01)");return}
      const r=D.rows.find(x=>x.id===id);if(r){r.phone=phone;dset("dbt",D)}close();renderDbt()};
  }
};
</script>
</body>
</html>
